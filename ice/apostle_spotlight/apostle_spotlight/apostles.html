<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body{
            background: tan; 
            display: flex;
            justify-self: center;
        }
        .spotlight{
            border: #ffffff 5px solid;
            width: 130px;
            height: 146px;
            border-radius: 50%;
            overflow: hidden;
            align-items: center;

        }

        .spotlight img{
            width: 130px;
        }

        .first_prezzy{
            justify-content: center;
            width: 160px;
            height: 146px;
            align-items: center;
        }

        .first_prezzy img{
            width: stretch;
            
            
        }

        .prophet{
            width: 200px;
            height: 200px;

        }

        .prophet img{
            width: stretch;
            /* height: inherit; */
        }

        div{
            display: inline-block;
            align-items: center;
        }

        #box{
            justify-content: center;
            margin: 20px;
            border:7px solid black;
            padding: 75px;
            display: inline-block;
            border-color: #1b0c4b;
            background-position: center;
            position: relative;
            background-size: cover;
            background-image:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.2)),
            url("images/christus.webp");;
            border-radius: 6%;
        }
        


        .apostle_grid{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:30px;
            justify-items:center;

        }

        h3{
            text-align: center;
            color:#ffffff;
        }

        h1{
            text-align: center;
            color:#ffffff;
        }

        #first_prez_box{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            
            justify-items: center;
        
        }

    </style>
</head>
<body>
    <!-- Insert HTML elements here -->

<div id="box">
    <h1>The First Presidency</h1>
    <div id="first_prez_box">
      
      <div class="spotlight first_prezzy">
        <img src="images/eyring.webp" alt="Elder Eyering">
      </div>

      <div class="spotlight first_prezzy prophet">
        <img src="images/oaks.webp" alt="President Oaks">
      </div>

      <div class="spotlight first_prezzy">
        <img src="images/christofferson.webp" alt="Elder Christofferson">
      </div>
    </div>

     <h3>Quorum of the twelve apostles</h3>

<div class="apostle_grid">
         <div class="spotlight">
             <img src="images/uchtdorf.webp" alt="Elder Uchtdorf">
         </div>

         <div class="spotlight">
             <img src="images/bednar.webp" alt="Elder Bednar">
         </div>

         <div class="spotlight">
             <img src="images/cook.webp" alt="Elder Cook">
         </div>

         <div class="spotlight">
             <img src="images/anderson.webp" alt="Elder Anderson">
         </div>

         <div class="spotlight">
             <img src="images/rasband.webp" alt="Elder Rasband">
         </div>

        <div class="spotlight">
             <img src="images/stevenson.webp" alt="Elder Stevenson">
         </div>

         <div class="spotlight">
             <img src="images/renlund.webp" alt="Elder Renlund">
         </div>

        <div class="spotlight">
             <img src="images/gong.webp" alt="Elder Gong">
         </div>

         <div class="spotlight">
             <img src="images/soares.webp" alt="Elder Soares">
         </div>

         <div class="spotlight">
             <img src="images/kearon.webp" alt="Elder Kearon">
         </div>

         <div class="spotlight">
            <img src="images/causse.webp" alt="Elder Causse">
         </div>
     
        <div class="spotlight">
             <img src="images/gilbert.webp" alt="Elder Gilbert">
        </div>

</div>
     
    </body>


</div>


</body>
</html>
